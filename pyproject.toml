[project]
name = "ai-trading-discipline-copilot"
version = "0.1.0"
description = "AI-powered trading discipline and psychology assistant backend built with FastAPI."
readme = "README.md"
authors = [
    { name = "Trading Discipline Team" }
]
requires-python = ">=3.13"

dependencies = [
    "alembic>=1.18.5",
    "asyncpg>=0.31.0",
    "bcrypt>=4.3.0",
    "celery>=5.6.3",
    "email-validator>=2.2.0",
    "fastapi[standard]>=0.138.2",
    "httpx>=0.28.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "pyjwt[crypto]>=2.13.0",
    "redis<5.0.0",
    "resend[async]>=2.32.2",
    "slowapi>=0.1.9",
    "sqlalchemy>=2.0.51",
    "uvicorn>=0.49.0",
    "websockets>=16.0",
    "yfinance>=0.2.37",
]

[build-system]
requires = ["uv_build>=0.11.22,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pre-commit>=4.6.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.20",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --cov=src --cov-report=term-missing --cov-fail-under=80"

[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.13"
strict = true
warn_unused_configs = false
disallow_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_reexport = true
warn_redundant_casts = true
warn_unused_ignores = true
pretty = true
show_error_codes = true

[[tool.mypy.overrides]]
# models/ has no py.typed marker yet — suppress until the layer is implemented.
module = ["ai_trading_discipline_copilot.models.*"]
ignore_missing_imports = true
ignore_errors = true

[[tool.mypy.overrides]]
module = [
    "ai_trading_discipline_copilot.services.market_service",
    "ai_trading_discipline_copilot.services.yfinance_service",
    "ai_trading_discipline_copilot.services.yfinance_ws_service",
    "ai_trading_discipline_copilot.tasks.market_tasks",
    "ai_trading_discipline_copilot.core.redis",
    "ai_trading_discipline_copilot.core.websocket_manager",
    "ai_trading_discipline_copilot.routers.dashboard",
    "ai_trading_discipline_copilot.main",
    "tests.helpers.jwt",
    "main",
    "test_frontend_ws",
    "test_ws",
]
ignore_errors = true



[tool.ruff]
target-version = "py313"
line-length = 88
exclude = [
    "alembic/**",
    "main.py",
    "src/ai_trading_discipline_copilot/services/market_service.py",
    "src/ai_trading_discipline_copilot/services/yfinance_service.py",
    "src/ai_trading_discipline_copilot/services/yfinance_ws_service.py",
    "src/ai_trading_discipline_copilot/tasks/market_tasks.py",
    "src/ai_trading_discipline_copilot/core/redis.py",
    "src/ai_trading_discipline_copilot/core/celery.py",
    "src/ai_trading_discipline_copilot/core/websocket_manager.py",
    "src/ai_trading_discipline_copilot/routers/dashboard.py",
    "src/ai_trading_discipline_copilot/main.py",
    "src/ai_trading_discipline_copilot/schemas/email_verification.py",
    "src/ai_trading_discipline_copilot/schemas/stock.py",
    "test_frontend_ws.py",
    "test_ws.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "ANN", "S", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "ANN", "S105", "S106", "E501"]
"alembic/versions/*.py" = ["E501"]

[tool.coverage.run]
source = ["ai_trading_discipline_copilot"]

[tool.coverage.paths]
source = [
    "src/ai_trading_discipline_copilot",
    "*/site-packages/ai_trading_discipline_copilot",
    "*\\site-packages\\ai_trading_discipline_copilot",
]
