repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.20
    hooks:
      - id: ruff-format
      - id: ruff-check

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.1.0
    hooks:
      - id: mypy
        exclude: ^alembic/
        additional_dependencies:
          - pydantic
          - pydantic-settings
          - sqlalchemy[mypy]
          - pyjwt[crypto]
          - bcrypt
          - fastapi

  - repo: local
    hooks:
      - id: semgrep
        name: semgrep
        entry: uv run semgrep --config=auto
        language: system
        pass_filenames: false
