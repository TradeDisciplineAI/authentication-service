# =============================================================================
# Secret Example — Authentication Service
#
# Template for sensitive environment variables (API keys, database URLs, OAuth credentials).
# Copy this file to k8s/secret.yaml and replace the placeholders with real base64-encoded values.
#
# ⚠️  To encode a value:
#     PowerShell:  [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes("your-value"))
#     Bash:        echo -n "your-value" | base64
#
# ⚠️  NEVER commit k8s/secret.yaml to Git! It is excluded by .gitignore.
# =============================================================================

apiVersion: v1
kind: Secret
metadata:
  name: auth-secrets
  namespace: authentication
  labels:
    app.kubernetes.io/name: auth-service
    app.kubernetes.io/component: secrets
    app.kubernetes.io/part-of: trading-platform
type: Opaque
data:
  # ── Security ─────────────────────────────────────────────────────────────────
  # Base64 encoded SECRET_KEY
  SECRET_KEY: "UkVQTEFDRV9XSVRIX0JBU0U2NF9TRUNSRVRfS0VZCg=="

  # ── Database ─────────────────────────────────────────────────────────────────
  # Base64 encoded DATABASE_URL (postgresql+asyncpg://...)
  DATABASE_URL: "UkVQTEFDRV9XSVRIX0JBU0U2NF9EQVRBQkFTRV9VUkwK"

  # ── AI / External APIs ──────────────────────────────────────────────────────
  OPENAI_API_KEY: ""
  FINNHUB_API_KEY: ""

  # ── Email ────────────────────────────────────────────────────────────────────
  RESEND_API_KEY: "UkVQTEFDRV9XSVRIX0JBU0U2NF9SRVNFTkRfS0VZCg=="

  # ── Google OAuth2 ────────────────────────────────────────────────────────────
  GOOGLE_CLIENT_ID: "UkVQTEFDRV9XSVRIX0JBU0U2NF9HT09HTEVfQ0xJRU5UX0lDCg=="
  GOOGLE_CLIENT_SECRET: "UkVQTEFDRV9XSVRIX0JBU0U2NF9HT09HTEVfQ0xJRU5UX1NFQ1JFVAo="
