# =============================================================================
# Redis — Service
#
# Exposes Redis internally within the cluster at redis:6379.
# =============================================================================

apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: authentication
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/component: cache
    app.kubernetes.io/part-of: trading-platform
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
      protocol: TCP
  type: ClusterIP
