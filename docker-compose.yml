# =============================================================================
# Authentication Service — Docker Compose Specification
#
# Services:
#   - app: FastAPI Web Application
#   - celery_worker: Background Task Worker
#   - celery_beat: Background Scheduler
#
# Infrastructure:
#   Connects to shared PostgreSQL ('shared_db') and shared Redis ('shared_redis')
#   via external network 'trading_network'.
# =============================================================================

services:
  auth_app:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: trading_app
    ports:
      - "8000:8000"
    command: ["sh", "-c", "alembic upgrade head && uvicorn ai_trading_discipline_copilot.main:app --host 0.0.0.0 --port 8000"]

    environment:
      - APP_NAME=AI Trading Discipline Copilot
      - APP_VERSION=0.1.0
      - APP_ENV=development
      - DEBUG=true

      - SECRET_KEY=${SECRET_KEY}
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
      - ENABLE_LOGIN_RATE_LIMITING=${ENABLE_LOGIN_RATE_LIMITING:-false}
      - COOKIE_SECURE=${COOKIE_SECURE:-false}

      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=redis://shared_redis:6379/0

      - AI_PROVIDER=openai
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - AI_MODEL=gpt-4o
      - FINNHUB_API_KEY=${FINNHUB_API_KEY}

      - ALLOWED_ORIGINS=["http://localhost:3000","http://localhost:8000","http://localhost:5175"]

      - RESEND_API_KEY=${RESEND_API_KEY}
      - EMAIL_FROM=${EMAIL_FROM}
      - FRONTEND_URL=${FRONTEND_URL}

      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}

      # ------------------ Razorpay Payment Gateway -----------------------
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID:-rzp_test_SngZ52YmkcixbB}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET:-hzG2fy9GDuAzmcWrYTACd8oD}
      - RAZORPAY_WEBHOOK_SECRET=${RAZORPAY_WEBHOOK_SECRET:-mock_webhook_secret_987654321}

    networks:
      - trading_network

    dns:
      - 8.8.8.8
      - 1.1.1.1

    restart: always

  auth_celery:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trading_celery

    command: ["celery", "-A", "ai_trading_discipline_copilot.core.celery.celery_app", "worker", "-Q", "auth_queue", "--loglevel=info"]

    environment:
      - REDIS_URL=redis://shared_redis:6379/0
      - DATABASE_URL=${DATABASE_URL}
      - SECRET_KEY=${SECRET_KEY}
      - FINNHUB_API_KEY=${FINNHUB_API_KEY}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - EMAIL_FROM=${EMAIL_FROM}
      - FRONTEND_URL=${FRONTEND_URL}

    networks:
      - trading_network

    dns:
      - 8.8.8.8
      - 1.1.1.1

    restart: always

  auth_celery_beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trading_celery_beat

    command: >
      celery
      -A ai_trading_discipline_copilot.core.celery.celery_app
      beat
      --loglevel=info
      --schedule=/tmp/celerybeat-schedule.db

    environment:
      - REDIS_URL=redis://shared_redis:6379/0
      - DATABASE_URL=${DATABASE_URL}
      - SECRET_KEY=${SECRET_KEY}
      - FINNHUB_API_KEY=${FINNHUB_API_KEY}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - EMAIL_FROM=${EMAIL_FROM}
      - FRONTEND_URL=${FRONTEND_URL}

    networks:
      - trading_network

    restart: always

networks:
  trading_network:
    external: true
