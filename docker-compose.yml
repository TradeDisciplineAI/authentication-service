services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trading_app
    ports:
      - "8000:8000"

    environment:
      - APP_NAME=AI Trading Discipline Copilot
      - APP_VERSION=0.1.0
      - APP_ENV=development
      - DEBUG=true

      - SECRET_KEY=${SECRET_KEY}
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=30

      - DATABASE_URL=postgresql+asyncpg://postgres:${POSTGRES_PASSWORD}@db:5432/trading_db

      - AI_PROVIDER=openai
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - AI_MODEL=gpt-4o
      - FINNHUB_API_KEY=${FINNHUB_API_KEY}

      - ALLOWED_ORIGINS=["http://localhost:3000","http://localhost:8000","http://localhost:5175"]

      - RESEND_API_KEY=${RESEND_API_KEY}
      - EMAIL_FROM=${EMAIL_FROM}
      - FRONTEND_URL=${FRONTEND_URL}

      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}

    depends_on:
      db:
        condition: service_healthy

    restart: always

  redis:
    image: redis:7-alpine
    container_name: trading_redis
    ports:
      - "6379:6379"
    restart: always

  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trading_celery

    command: >
      celery
      -A ai_trading_discipline_copilot.core.celery.celery_app
      worker
      --loglevel=info

    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql+asyncpg://postgres:${POSTGRES_PASSWORD}@db:5432/trading_db
      - SECRET_KEY=${SECRET_KEY}
      - FINNHUB_API_KEY=${FINNHUB_API_KEY}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - EMAIL_FROM=${EMAIL_FROM}
      - FRONTEND_URL=${FRONTEND_URL}

    depends_on:
      - redis
      - db

    restart: always

  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trading_celery_beat

    command: >
      celery
      -A ai_trading_discipline_copilot.core.celery.celery_app
      beat
      --loglevel=info
      --schedule=/tmp/celerybeat-schedule.db

    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql+asyncpg://postgres:${POSTGRES_PASSWORD}@db:5432/trading_db
      - SECRET_KEY=${SECRET_KEY}
      - FINNHUB_API_KEY=${FINNHUB_API_KEY}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - EMAIL_FROM=${EMAIL_FROM}
      - FRONTEND_URL=${FRONTEND_URL}

    depends_on:
      - redis
      - db

    restart: always

  db:
    image: postgres:16-alpine
    container_name: trading_db

    ports:
      - "5432:5432"

    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=trading_db

    volumes:
      - pgdata:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d trading_db"]
      interval: 10s
      timeout: 5s
      retries: 5

    restart: always

volumes:
  pgdata: